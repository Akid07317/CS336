[project]
name = "cs336-env-a3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cs336-scaling", "pytest>=8", "ipykernel>=6.29", "matplotlib>=3.9", "numpy>=2.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
cs336-scaling = { path = "../../assignments/assignment3-scaling", editable = true }
