[project]
name = "cs336-env-a5"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alignment", "torch==2.11.0", "pytest>=8", "ipykernel>=6.29"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
alignment = { path = "../../assignments/assignment5-alignment", editable = true }
