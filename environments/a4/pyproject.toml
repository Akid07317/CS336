[project]
name = "cs336-env-a4"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cs336-data", "torch==2.11.0", "pytest>=8", "ipykernel>=6.29"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
cs336-data = { path = "../../assignments/assignment4-data", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
